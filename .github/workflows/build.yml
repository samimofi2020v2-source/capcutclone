name: Build CapCutClone APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Download source
        run: |
          curl -L -o src.zip "https://user.uploads.dev/file/2d5c315ba34e5fd142dfc79077a7309d.zip"
          python3 -c "import zipfile; zipfile.ZipFile('src.zip').extractall('app-src')"
          mv app-src/CapCutClone/* "$GITHUB_WORKSPACE"/
          ls -R | head -40

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapCutClone-debug
          path: app/build/outputs/apk/debug/app-debug.apk
